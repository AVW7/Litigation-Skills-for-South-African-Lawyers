<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0c1220"/>
  <rect width="800" height="500" fill="url(#bgGrad)" opacity="0.5"/>
  
  <!-- Decorative background elements -->
  <circle cx="100" cy="400" r="150" fill="url(#blueGrad)" opacity="0.03"/>
  <circle cx="700" cy="100" r="120" fill="url(--purpleGrad)" opacity="0.03"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#f1f5f9" font-family="Outfit, sans-serif" font-size="28" font-weight="700">
    Burden & Standard of Proof in South African Law
  </text>
  
  <!-- CIVIL LAW SECTION -->
  <g transform="translate(50, 80)">
    <!-- Section header -->
    <rect x="0" y="0" width="320" height="50" rx="12" fill="url(#blueGrad)" filter="url(#shadow)"/>
    <text x="160" y="32" text-anchor="middle" fill="#fff" font-family="Outfit, sans-serif" font-size="18" font-weight="600">
      ⚖️ CIVIL CASES
    </text>
    
    <!-- Civil box -->
    <rect x="20" y="70" width="280" height="200" rx="16" fill="rgba(30,39,64,0.85)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>
    
    <!-- Balance Scale Visual -->
    <g transform="translate(140, 120)">
      <!-- Base -->
      <rect x="-40" y="110" width="80" height="8" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
      <!-- Pillar -->
      <rect x="-4" y="40" width="8" height="70" fill="url(#goldGrad)"/>
      <!-- Beam -->
      <rect x="-60" y="35" width="120" height="6" rx="3" fill="url(#goldGrad)"/>
      <!-- Left pan (Plaintiff - heavier) -->
      <line x1="-50" y1="35" x2="-50" y2="70" stroke="#3b82f6" stroke-width="2"/>
      <ellipse cx="-50" cy="80" rx="25" ry="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
      <text x="-50" y="102" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">PLAINTIFF</text>
      <text x="-50" y="115" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="700">51%+</text>
      
      <!-- Right pan (Defendant - lighter) -->
      <line x1="50" y1="35" x2="50" y2="55" stroke="#9ca3af" stroke-width="2"/>
      <ellipse cx="50" cy="65" rx="25" ry="10" fill="rgba(156,163,175,0.3)" stroke="#9ca3af"/>
      <text x="50" y="87" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">DEFENDANT</text>
      <text x="50" y="100" text-anchor="middle" fill="#9ca3af" font-size="13">49%</text>
    </g>
    
    <!-- Standard -->
    <text x="160" y="250" text-anchor="middle" fill="#60a5fa" font-family="Outfit, sans-serif" font-size="16" font-weight="600">
      Balance of Probabilities
    </text>
    <text x="160" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">
      "More likely than not"
    </text>
  </g>
  
  <!-- CRIMINAL LAW SECTION -->
  <g transform="translate(430, 80)">
    <!-- Section header -->
    <rect x="0" y="0" width="320" height="50" rx="12" fill="url(#redGrad)" filter="url(#shadow)"/>
    <text x="160" y="32" text-anchor="middle" fill="#fff" font-family="Outfit, sans-serif" font-size="18" font-weight="600">
      🔒 CRIMINAL CASES
    </text>
    
    <!-- Criminal box -->
    <rect x="20" y="70" width="280" height="200" rx="16" fill="rgba(30,39,64,0.85)" stroke="rgba(239,68,68,0.4)" stroke-width="2"/>
    
    <!-- Balance Scale Visual - Criminal -->
    <g transform="translate(140, 120)">
      <!-- Base -->
      <rect x="-40" y="110" width="80" height="8" rx="4" fill="url(#goldGrad)" filter="url(#shadow)"/>
      <!-- Pillar -->
      <rect x="-4" y="40" width="8" height="70" fill="url(#goldGrad)"/>
      <!-- Beam - tilted opposite -->
      <rect x="-60" y="35" width="120" height="6" rx="3" fill="url(#goldGrad)" transform="rotate(-12)"/>
      
      <!-- Left pan (State - very heavy) -->
      <line x1="-50" y1="45" x2="-50" y2="90" stroke="#ef4444" stroke-width="2"/>
      <ellipse cx="-50" cy="100" rx="28" ry="12" fill="url(#redGrad)" filter="url(#shadow)"/>
      <text x="-50" y="122" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">STATE</text>
      <text x="-50" y="135" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">99%</text>
      
      <!-- Right pan (Accused - light, presumption of innocence) -->
      <line x1="50" y1="25" x2="50" y2="50" stroke="#10b981" stroke-width="2"/>
      <ellipse cx="50" cy="60" rx="25" ry="10" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="50" y="82" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">ACCUSED</text>
      <text x="50" y="95" text-anchor="middle" fill="#6ee7b7" font-size="10">Innocent until</text>
      <text x="50" y="106" text-anchor="middle" fill="#6ee7b7" font-size="10">proven guilty</text>
    </g>
    
    <!-- Standard -->
    <text x="160" y="250" text-anchor="middle" fill="#fca5a5" font-family="Outfit, sans-serif" font-size="16" font-weight="600">
      Beyond Reasonable Doubt
    </text>
    <text x="160" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">
      "Virtually certain"
    </text>
  </g>
  
  <!-- Bottom note -->
  <text x="400" y="460" text-anchor="middle" fill="#64748b" font-size="13" font-family="Inter, sans-serif">
    The plaintiff/State carries the onus but the accused benefits from the presumption of innocence
  </text>
  
  <!-- Key Principle Box -->
  <rect x="200" y="380" width="400" height="50" rx="8" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="400" y="410" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="500">
    Key Principle: The person who alleges must prove (EI qui affirmat, non ei qui negat, incumbit probatio)
  </text>
</svg>